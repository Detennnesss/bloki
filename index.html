<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="bloki">
<meta name="theme-color" content="#1c120d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>bloki</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  @property --hue { syntax: '<number>'; inherits: true; initial-value: 230; }
  :root {
    --hue: 230;
    --glass-bg: linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,.06));
    --glass-border: rgba(255,255,255,.28);
    --glass-shadow:
      inset 0 1px 1px rgba(255,255,255,.55),
      inset 0 -1px 1px rgba(255,255,255,.12),
      0 10px 30px rgba(0,0,0,.28);
  }
  body {
    background:
      radial-gradient(circle at 50% 0%, hsl(var(--hue) 48% 30%) 0, transparent 70%),
      linear-gradient(160deg, hsl(var(--hue) 38% 17%), hsl(var(--hue) 45% 6%));
    background-attachment: fixed;
    transition: --hue 1.2s ease;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #leaves { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .leaf {
    position: absolute; top: 0; will-change: transform;
    animation: fall linear infinite;
  }
  .leaf.bat { animation-name: fly; }
  @keyframes fall {
    0%   { transform: translate3d(0, -12vh, 0) rotate(0deg); }
    25%  { transform: translate3d(var(--sx), 22vh, 0) rotate(90deg); }
    50%  { transform: translate3d(calc(var(--sx) * -1), 50vh, 0) rotate(190deg); }
    75%  { transform: translate3d(var(--sx), 80vh, 0) rotate(280deg); }
    100% { transform: translate3d(0, 112vh, 0) rotate(370deg); }
  }
  @keyframes fly {
    0%   { transform: translate3d(-10vw, 8vh, 0) rotate(-8deg); }
    50%  { transform: translate3d(55vw, 2vh, 0) rotate(8deg); }
    100% { transform: translate3d(112vw, 12vh, 0) rotate(-8deg); }
  }
  .moon {
    position: fixed; top: 5vh; right: 9vw; width: 72px; height: 72px; border-radius: 50%; z-index: 0;
    pointer-events: none;
    background: radial-gradient(circle at 35% 35%, #fff2c2 0, #f0cf7a 60%, #c99f4a 100%);
    box-shadow: 0 0 40px 12px rgba(240,207,122,.28), 0 0 120px 40px rgba(240,207,122,.12);
    opacity: .55;
  }
  .web { position: fixed; z-index: 0; pointer-events: none; opacity: .16; width: min(46vw, 210px); aspect-ratio: 1; }
  .web svg { width: 100%; height: 100%; display: block; }
  .web.tl { top: 0; left: 0; }
  .web.tr { top: 0; right: 0; transform: scaleX(-1); }
  .web.bl { bottom: 0; left: 0; transform: scaleY(-1); width: min(34vw, 150px); opacity: .12; }
  .web.br { bottom: 0; right: 0; transform: scale(-1, -1); width: min(34vw, 150px); opacity: .12; }
  #app { position: relative; z-index: 1; }
  #app {
    height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  .box { display: flex; flex-direction: column; align-items: center; min-width: 90px; }
  .box span { font-size: 11px; letter-spacing: 1.5px; opacity: .6; }
  .box b { font-size: 30px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; color: #fff; cursor: pointer;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    border-radius: 14px; padding: 10px 16px;
    transition: transform .15s ease;
  }
  button:active { transform: scale(.94); }
  .box {
    padding: 8px 14px; border-radius: 18px;
    background: var(--glass-bg); border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
  }
  #restart, #settingsBtn { font-size: 22px; width: 48px; height: 48px; padding: 0; border-radius: 50%; }
  .ctrls { display: flex; gap: 8px; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 36px; margin: 0 0 18px; font-size: 19px; }
  .card button.sw {
    width: 54px; height: 32px; padding: 0; border-radius: 999px; position: relative; flex: none;
    background: var(--glass-bg); font-size: 0; text-shadow: none;
  }
  .card button.sw::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .2s ease;
  }
  .card button.sw.on { background: linear-gradient(160deg, rgba(120,255,170,.75), rgba(40,190,110,.65)); }
  .card button.sw.on::after { transform: translateX(22px); }
  #boardwrap { position: relative; }
  #board {
    display: grid; gap: 2px; padding: 6px; border-radius: 28px;
    background: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.04));
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
  }
  .cell {
    border-radius: 26%;
    background: rgba(255,255,255,.07);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.25), inset 0 -1px 0 rgba(255,255,255,.08);
  }
  #board .cell { width: var(--cell); height: var(--cell); }
  .cell.on {
    background:
      radial-gradient(120% 90% at 30% 0%, rgba(255,255,255,.7) 0, rgba(255,255,255,0) 45%),
      linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, white) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, black) 100%);
    border: 1px solid rgba(255,255,255,.55);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.7),
      inset 0 -3px 6px rgba(0,0,0,.22),
      0 3px 8px color-mix(in srgb, var(--c) 45%, transparent);
  }
  .cell.ghost { background: var(--c); opacity: .45; border: 1px solid rgba(255,255,255,.5); }
  .cell.will { filter: brightness(1.45) saturate(1.2); }
  .cell.clearing { animation: pop .26s forwards; }
  @keyframes pop {
    50% { transform: scale(1.15); filter: brightness(1.8); }
    100% { transform: scale(0); opacity: 0; }
  }
  .piece { display: grid; gap: 2px; }
  .hole { background: transparent; }
  #tray { display: flex; justify-content: space-around; align-items: center; }
  .slot { display: flex; align-items: center; justify-content: center; touch-action: none; }
  .slot.hidden-piece .piece { opacity: .2; }
  .piece.drag {
    position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
  }
  #toast {
    position: absolute; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none;
    font-size: 34px; font-weight: 800; text-shadow: 0 3px 12px rgba(0,0,0,.6);
    opacity: 0; white-space: pre-line;
  }
  #toast.show { animation: toast 1s ease-out; }
  @keyframes toast {
    0% { opacity: 0; transform: translateY(14px) scale(.8); }
    20% { opacity: 1; transform: translateY(0) scale(1.05); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px); }
  }
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10,14,40,.35); z-index: 100;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .overlay.show { display: flex; animation: overIn .25s ease-out; }
  .overlay.show .card { animation: cardIn .38s cubic-bezier(.2,1.3,.4,1); }
  .overlay.show.closing { animation: overOut .22s ease-in forwards; pointer-events: none; }
  .overlay.show.closing .card { animation: cardOut .22s ease-in forwards; }
  #start h1 { margin: 0 0 18px; font-size: 40px; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,.3); }
  @keyframes overOut { to { opacity: 0; } }
  @keyframes cardOut { to { opacity: 0; transform: translateY(16px) scale(.92); } }
  @keyframes overIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.88); }
    to { opacity: 1; transform: none; }
  }
  .card {
    background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
    border-radius: 32px; padding: 28px 36px; text-align: center;
  }
  .card h2 { margin: 0 0 8px; }
  .card p { margin: 0 0 18px; font-size: 18px; }
  .card button {
    background: linear-gradient(160deg, rgba(120,255,170,.75), rgba(40,190,110,.65));
    color: #fff; font-weight: 700; font-size: 17px; border-radius: 999px; padding: 12px 26px;
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div class="moon"></div>
<div id="leaves"></div>
<div id="app">
  <header id="header">
    <div class="box"><span>СЧЁТ</span><b id="score">0</b></div>
    <div class="ctrls">
      <button id="settingsBtn" aria-label="Настройки">⚙</button>
      <button id="restart" aria-label="Заново">↻</button>
    </div>
    <div class="box"><span>РЕКОРД</span><b id="best">0</b></div>
  </header>
  <div id="boardwrap">
    <div id="board"></div>
    <div id="toast"></div>
  </div>
  <div id="tray"></div>
</div>
<div id="start" class="overlay">
  <div class="card">
    <h1>bloki</h1>
    <button id="startBtn">Старт</button>
  </div>
</div>
<div id="settings" class="overlay">
  <div class="card">
    <h2>Настройки</h2>
    <div class="set-row"><span>Музыка</span><button class="sw" id="swMusic" role="switch" aria-label="Музыка"></button></div>
    <div class="set-row"><span>Звуковые эффекты</span><button class="sw" id="swSfx" role="switch" aria-label="Звуковые эффекты"></button></div>
    <button id="settingsClose">Готово</button>
  </div>
</div>
<div id="over" class="overlay">
  <div class="card">
    <h2>Игра окончена</h2>
    <p>Счёт: <b id="final">0</b></p>
    <button id="again">Играть снова</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
