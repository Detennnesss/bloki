<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Блоки">
<meta name="theme-color" content="#141a3a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Блоки</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: radial-gradient(circle at 50% 0%, #26306a 0%, #141a3a 60%, #0c1028 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #app {
    height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { display: flex; justify-content: space-between; align-items: center; }
  .box { display: flex; flex-direction: column; align-items: center; min-width: 90px; }
  .box span { font-size: 11px; letter-spacing: 1.5px; opacity: .6; }
  .box b { font-size: 30px; font-variant-numeric: tabular-nums; }
  button {
    font: inherit; color: #fff; border: 0; cursor: pointer;
    background: #2f3b7c; border-radius: 12px; padding: 10px 16px;
  }
  #restart { font-size: 22px; width: 48px; height: 48px; padding: 0; border-radius: 50%; }
  #boardwrap { position: relative; }
  #board {
    display: grid; gap: 2px; padding: 4px; border-radius: 12px;
    background: #0b0f26;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
  }
  .cell { border-radius: 22%; background: #1d2650; }
  #board .cell { width: var(--cell); height: var(--cell); }
  .cell.on {
    background: var(--c);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.25);
  }
  .cell.ghost { background: var(--c); opacity: .55; }
  .cell.will { filter: brightness(1.45); }
  .cell.clearing { animation: pop .26s forwards; }
  @keyframes pop {
    50% { transform: scale(1.15); filter: brightness(1.8); }
    100% { transform: scale(0); opacity: 0; }
  }
  .piece { display: grid; gap: 2px; }
  .hole { background: transparent; }
  #tray { display: flex; justify-content: space-around; align-items: center; }
  .slot { display: flex; align-items: center; justify-content: center; touch-action: none; }
  .slot.hidden-piece .piece { opacity: .2; }
  .piece.drag {
    position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
  }
  #toast {
    position: absolute; left: 0; right: 0; top: 40%; text-align: center; pointer-events: none;
    font-size: 34px; font-weight: 800; text-shadow: 0 3px 12px rgba(0,0,0,.6);
    opacity: 0; white-space: pre-line;
  }
  #toast.show { animation: toast 1s ease-out; }
  @keyframes toast {
    0% { opacity: 0; transform: translateY(14px) scale(.8); }
    20% { opacity: 1; transform: translateY(0) scale(1.05); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-24px); }
  }
  #over {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5,8,25,.75); z-index: 100;
  }
  #over.show { display: flex; }
  .card { background: #1d2650; border-radius: 18px; padding: 28px 36px; text-align: center; }
  .card h2 { margin: 0 0 8px; }
  .card p { margin: 0 0 18px; font-size: 18px; }
  .card button { background: #4cd97b; color: #0b0f26; font-weight: 700; font-size: 17px; }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="box"><span>СЧЁТ</span><b id="score">0</b></div>
    <button id="restart" aria-label="Заново">↻</button>
    <div class="box"><span>РЕКОРД</span><b id="best">0</b></div>
  </header>
  <div id="boardwrap">
    <div id="board"></div>
    <div id="toast"></div>
  </div>
  <div id="tray"></div>
</div>
<div id="over">
  <div class="card">
    <h2>Игра окончена</h2>
    <p>Счёт: <b id="final">0</b></p>
    <button id="again">Играть снова</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
